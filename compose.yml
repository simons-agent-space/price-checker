services:
  price-checker:
    build: .
    # Run as root inside the container so the process can write to the
    # named volume. The volume is created root-owned by Docker; the
    # distroless nonroot (UID 65532) cannot. Tradeoff: loses nonroot
    # benefit. Cleaner fix is a bind mount with pre-set ownership via the
    # provisioner — deferred.
    user: "0:0"
    restart: unless-stopped

    ports:
      - "127.0.0.1:18081:3000"

    volumes:
      - price-checker-data:/data

    environment:
      DATABASE_URL: "file:/data/price-checker.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)"
      HTTP_BASIC_AUTH_USER: ${HTTP_BASIC_AUTH_USER:?HTTP_BASIC_AUTH_USER must be set}
      HTTP_BASIC_AUTH_PASS: ${HTTP_BASIC_AUTH_PASS:?HTTP_BASIC_AUTH_PASS must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # Distroless lacks a shell, so CMD-SHELL is unavailable. The binary
    # supports its own non-mutating probe instead.
    healthcheck:
      test: ["CMD", "/price-checker", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  price-checker-data:
