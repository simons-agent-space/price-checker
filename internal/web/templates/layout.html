{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · price-checker</title>
<style>
body {
    font-family: -apple-system, system-ui, "Helvetica Neue", "Arial Black", Arial, sans-serif;
    font-weight: 700;
    margin: 0;
    padding: 28px;
    color: #000;
    background: #FFFEF7;
    line-height: 1.45;
    min-height: 100vh;
}
header {
    background: #FFE500;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
}
header h1 { margin: 0; font-size: 1.6rem; }
header h1 a { color: #000; text-decoration: none; }
header nav { display: flex; gap: 12px; flex-wrap: wrap; }
header nav a {
    color: #000;
    text-decoration: none;
    border: 3px solid #000;
    padding: 4px 12px;
    background: #FFFEF7;
    font-size: 0.95rem;
}
header nav a:hover { background: #000; color: #FFE500; }
main { max-width: 1100px; }
h2 { margin: 0 0 12px; font-size: 1.3rem; }
table {
    width: 100%;
    border-collapse: collapse;
    background: #FFFEF7;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
}
th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 3px solid #000;
    vertical-align: top;
}
th { background: #000; color: #FFE500; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #FFE500; }
.empty {
    border: 4px dashed #000;
    padding: 24px;
    text-align: center;
    background: #FFFEF7;
}
a { color: #000; }
.btn {
    display: inline-block;
    border: 3px solid #000;
    background: #FFE500;
    padding: 6px 14px;
    text-decoration: none;
    font-weight: 700;
}
.btn:hover { background: #000; color: #FFE500; }
.ok { color: #1a7a1a; }
.err { color: #b00020; }
.muted { color: #555; }
.breadcrumb { margin-bottom: 16px; font-size: 0.95rem; }
.breadcrumb a { text-decoration: underline; }
.deal-discount {
    display: inline-block;
    background: #b00020;
    color: #FFFEF7;
    padding: 2px 8px;
    border: 2px solid #000;
    font-size: 0.9rem;
}
@media (max-width: 720px) {
    body { padding: 16px; }
    header { flex-direction: column; align-items: flex-start; }
    th, td { padding: 8px; font-size: 0.9rem; }
    table { font-size: 0.9rem; }
    .url-cell { word-break: break-all; }
}
</style>
</head>
<body>
<header>
    <h1><a href="/">price-checker</a></h1>
    <nav>
        <a href="/">searches</a>
        <a href="/deals">deals</a>
    </nav>
</header>
<main>{{template "content" .}}</main>
</body>
</html>{{end}}
